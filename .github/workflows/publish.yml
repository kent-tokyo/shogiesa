name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to publish (for example, v0.10.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify publishable packages
        run: cargo package --workspace --locked

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p stratifykit-core --locked
          cargo publish -p shogiesa-core --locked
          cargo publish -p shogiesa-csa --locked
          cargo publish -p shogiesa-kif --locked
          cargo publish -p shogiesa-pack --locked
          cargo publish -p shogiesa-usi --locked
          cargo publish -p shogiesa-stratify --locked
          cargo publish -p shogiesa --locked
          cargo publish -p shogiesa-cli --locked

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --title "shogiesa $RELEASE_TAG" \
            --notes "## Highlights

          - Nested KIF variation parentage and input-boundary hardening.
          - Portable fixture validation and dependency updates.

          ## Validation

          - Workspace tests, strict Clippy, package verification, CI, and CodeQL passed.
          - All publishable crates were uploaded to crates.io by this workflow."
