name: Publish release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated tag to publish (for example, v0.11.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify publishable packages
        run: cargo package --workspace --locked

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"

          published() {
            cargo info "$1@$version" --registry crates-io >/dev/null 2>&1
          }

          publish_one() {
            package="$1"

            if published "$package"; then
              echo "$package@$version is already published"
              return 0
            fi

            for attempt in 1 2 3 4 5; do
              echo "publishing $package@$version (attempt $attempt/5)"
              if cargo publish -p "$package" --locked; then
                for propagation_check in $(seq 1 18); do
                  if published "$package"; then
                    return 0
                  fi
                  echo "waiting for $package@$version registry propagation ($propagation_check/18)"
                  sleep 10
                done
              elif published "$package"; then
                return 0
              else
                sleep 20
              fi
            done

            echo "failed to publish or observe $package@$version" >&2
            return 1
          }

          publish_one stratifykit-core
          publish_one shogiesa-core
          publish_one shogiesa-csa
          publish_one shogiesa-kif
          publish_one shogiesa-pack
          publish_one shogiesa-usi
          publish_one shogiesa-stratify
          publish_one shogiesa
          publish_one shogiesa-cli

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --title "shogiesa $RELEASE_TAG" \
            --generate-notes
