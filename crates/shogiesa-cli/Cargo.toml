[package]
name = "shogiesa-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "CLI for shogiesa — Shogi training-data feed for NNUE engines"
keywords = ["shogi", "nnue", "sfen", "training-data", "usi"]
categories = ["command-line-utilities", "game-engines"]

[[bin]]
name = "shogiesa"
path = "src/main.rs"

[dependencies]
shogiesa-core = { path = "../shogiesa-core", version = "0.9" }
shogiesa-csa = { path = "../shogiesa-csa", version = "0.9" }
shogiesa-kif = { path = "../shogiesa-kif", version = "0.9" }
shogiesa-usi = { path = "../shogiesa-usi", version = "0.9" }
shogiesa-pack = { path = "../shogiesa-pack", version = "0.9" }
shogiesa-stratify = { path = "../shogiesa-stratify", version = "0.9" }
stratifykit-core = { path = "../stratifykit-core", version = "0.9" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1"
sha2 = "0.10"
shogi_core = "0.1"
shogi_usi_parser = "0.1"
shogi_legality_lite = "0.1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
